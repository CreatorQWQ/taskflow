version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always # 挂了自动重启
    environment:
      POSTGRES_PASSWORD: 123456 # 换成复杂的密码
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_NAME=taskflow
      - JWT_SECRET=your_production_secret
    depends_on:
      - db

volumes:
  pgdata: